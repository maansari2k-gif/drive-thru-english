<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#D64512"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style></head><body>
<title>Drive-Thru English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;800&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<style>
/* Layout: one-column phone app, big tap targets, bottom tab bar. Lexend is built for easier reading. */
:root{
  --bg:#F6F4EF; --card:#FFFFFF; --ink:#211C17; --soft:#6B6158; --line:#E4DED4;
  --flame:#D64512; --flame-ink:#FFFFFF; --mustard:#F2B632; --good:#2E8B43; --bad:#C2410C; --tint:#FCE9DF;
  --font:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17130F; --card:#231D18; --ink:#F4EEE6; --soft:#B3A797; --line:#3A3129;
  --flame:#F0672E; --flame-ink:#1A0E07; --mustard:#F4C04F; --good:#5CC274; --bad:#FF8A4C; --tint:#3A2318; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130F; --card:#231D18; --ink:#F4EEE6; --soft:#B3A797; --line:#3A3129;
  --flame:#F0672E; --flame-ink:#1A0E07; --mustard:#F4C04F; --good:#5CC274; --bad:#FF8A4C; --tint:#3A2318; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.app{display:flex;flex-direction:column;min-height:100%;max-width:560px;margin:0 auto}
main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;display:flex;flex-direction:column;gap:14px}
h1{font-size:26px;margin:0;font-weight:800;text-wrap:balance}
h2{font-size:20px;margin:0;font-weight:700}
.sub{color:var(--soft);font-size:16px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ring{display:flex;align-items:center;gap:16px}
.ring .num{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--flame);border-radius:7px;transition:width .4s}
.step{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;min-height:76px}
.step .ic{font-size:30px;width:44px;text-align:center;flex:none}
.step .tx{flex:1;min-width:0}
.step b{display:block;font-size:19px}
.step span{color:var(--soft);font-size:15px}
.step.done{border-color:var(--good)}
.step.done .chk{color:var(--good)}
.chk{font-size:26px;color:var(--line);flex:none}
.big{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border-radius:16px;font-size:20px;font-weight:700;padding:10px 16px;width:100%}
.primary{background:var(--flame);color:var(--flame-ink)}
.ghost{background:var(--card);border:2px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.mic{background:var(--mustard);color:#211C17}
.mic.on{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.75}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}.bar>i{transition:none}}
.phrase{font-size:27px;font-weight:700;line-height:1.3;text-wrap:balance}
.label{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:700}
.sounds{font-size:20px;color:var(--flame);font-style:italic}
.means{font-size:18px}
.tip{background:var(--tint);border-radius:14px;padding:12px 14px;font-size:16px}
.words{font-size:22px;line-height:1.6}
.w-ok{color:var(--good);font-weight:700}
.w-miss{color:var(--bad);font-weight:700;text-decoration:underline wavy}
.score{font-size:22px;font-weight:800}
.heard{color:var(--soft);font-size:16px}
.hidebox{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--soft)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:560px}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 12px;font-size:13px;color:var(--soft);font-weight:500}
nav button i{font-style:normal;font-size:26px}
nav button[aria-current="page"]{color:var(--flame);font-weight:700}
.top{display:flex;align-items:center;gap:10px}
.top .back{font-size:26px;width:48px;height:48px;border-radius:14px;background:var(--card);border:1px solid var(--line);flex:none}
.top .count{margin-left:auto;color:var(--soft);font-variant-numeric:tabular-nums}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left;min-height:84px;display:flex;flex-direction:column;gap:4px}
.cat i{font-style:normal;font-size:28px}
.cat b{font-size:17px}
.cat .ur{font-size:16px;line-height:1.9}
.step .ur{font-size:15px;line-height:1.9;text-align:left}
.pitem .ur{font-size:17px}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.pitem .t{flex:1;min-width:0;font-size:17px}
.pitem button{width:48px;height:48px;border-radius:12px;font-size:22px;background:var(--bg);flex:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:12px;color:var(--soft)}
.week s{display:block;width:100%;background:var(--flame);border-radius:6px 6px 2px 2px;min-height:3px;text-decoration:none}
.week s.full{background:var(--good)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--flame);background:var(--tint)}
select{font:inherit;font-size:16px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:28px;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--soft)}
.note{font-size:14px;color:var(--soft)}
.feature{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.feature:first-of-type{border-top:0;padding-top:0}
.feature button{align-self:flex-start;padding:8px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:16px}
.cust{display:flex;gap:10px;align-items:flex-start}
.cust .who{font-size:28px}
.ur{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Urdu Typesetting",serif;font-size:19px;line-height:2.1;color:var(--soft);text-align:right;font-weight:400;font-style:normal}
.phrase+.ur{font-size:21px;color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:16px;z-index:9;max-width:90%}
</style>

<div class="app">
  <main id="view" aria-live="polite"></main>
  <nav><div class="in">
    <button data-tab="today"><i>🏠</i>Today</button>
    <button data-tab="phrases"><i>💬</i>Phrases</button>
    <button data-tab="accent"><i>👂</i>Texas talk</button>
    <button data-tab="progress"><i>⭐</i>Progress</button>
  </div></nav>
</div>
<div class="toast" id="toast" hidden></div>

const ACCENT = [
  {t:"Y'all = you all", d:"Almost everyone in Texas says \"y'all\" when talking to you or your team. It is friendly, not rude.", ex:"Y'all open late tonight?"},

const ALLP = []; CATS.forEach(c=>c.phrases.forEach((en,i)=>ALLP.push({id:"p:"+c.id+i,cat:c.id,en})));

const GAPS = [0,1,2,4,7,14,30]; // days per box (spaced repetition)
const DAY_GOAL = 30*60;

const KEY="dte-v1";
let S = load();
function load(){ let s=null; try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  return Object.assign({cards:{},days:{},rate:1,voice:"",dialog:0},s||{}); }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} }
function dkey(d=new Date()){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function today(){ const k=dkey(); if(!S.days[k]) S.days[k]={sec:0,done:[]}; return S.days[k]; }
function isDue(id){ const c=S.cards[id]; return c && c.due<=Date.now(); }
function seen(id){ return !!S.cards[id]; }
function grade(id,ok){
  const c=S.cards[id]||{box:0,due:0,n:0};
  c.n=(c.n||0)+1;
  c.box = ok ? Math.min(c.box+1,GAPS.length-1) : 0;
  const d=new Date(); d.setHours(4,0,0,0); d.setDate(d.getDate()+GAPS[c.box]);
  c.due = ok ? d.getTime() : Date.now();
  S.cards[id]=c; save();
}
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }
function pick(pool,n){
  const due=shuffle(pool.filter(x=>isDue(x.id))).sort((a,b)=>S.cards[a.id].box-S.cards[b.id].box);
  const fresh=pool.filter(x=>!seen(x.id));
  return [...due,...fresh].slice(0,n);
}

/* ============ VOICE OUT ============ */
let voices=[]; let speaking=false;
function loadVoices(){
  if(!("speechSynthesis" in window)) return;
  const all=speechSynthesis.getVoices();
  voices=all.filter(v=>/^en[-_]US/i.test(v.lang));
  if(!voices.length) voices=all.filter(v=>/^en/i.test(v.lang));
}
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function voiceFor(kind){
  if(!voices.length) return null;
  const chosen=voices.find(v=>v.name===S.voice);
  if(kind==="me") return chosen||voices[0];
  // customers: use a different voice than "me" so it feels like another person
  const others=voices.filter(v=>v!==(chosen||voices[0]));
  return others.length? others[Math.floor(Math.random()*others.length)] : (chosen||voices[0]);
}
let ttsCap=null;
function say(text,{rate=S.rate,kind="me"}={}){
  return new Promise(res=>{
    if("speechSynthesis" in window){
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      const v=voiceFor(kind); if(v){u.voice=v;u.lang=v.lang}else u.lang="en-US";
      u.rate=rate; speaking=true;
      u.onend=u.onerror=()=>{speaking=false;res()};
      speechSynthesis.speak(u);
      setTimeout(()=>{speaking=false;res()},Math.max(4000,text.length*160/rate));
    } else if(ttsCap){
      ttsCap.speak(text,{rate:Math.max(.7,Math.min(1.5,rate)),language:"en"}).catch(()=>{}).finally(res);
    } else { toast("This phone cannot read aloud. Try Chrome or Safari."); res(); }
  });
}

/* ============ MICROPHONE ============ */
let dict=null;
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
(async()=>{ await null; try{ if(window.claude?.use){ dict=await window.claude.use("dictation"); ttsCap=await window.claude.use("tts"); } }catch(e){} if(typeof view!=="undefined"&&view==="today") render(); })();
function micAvailable(){ return !!(dict||SR); }

let micStop=null;
function listen(onPartial){
  // Must be called directly from a tap.
  return new Promise((resolve)=>{
    if("speechSynthesis" in window) speechSynthesis.cancel();
    if(dict){
      let text="", partial="", timer=null, done=false;
      const fin=()=>{ if(done) return; done=true; offs.forEach(f=>f&&f()); micStop=null; resolve((text+" "+partial).trim()); };
      const stop=()=>{ clearTimeout(timer); dict.stop().catch(()=>{}).finally(fin); };
      const quiet=()=>{ clearTimeout(timer); timer=setTimeout(stop,1800); };
      const offs=[
        dict.onPartial(({text:t})=>{partial=t; onPartial&&onPartial((text+" "+t).trim()); quiet();}),
        dict.onFinal(({text:t})=>{text=(text+" "+t).trim(); partial=""; onPartial&&onPartial(text); quiet();}),
        dict.onState(({state})=>{ if(state==="idle") fin(); })
      ];
      micStop=stop;
      dict.start({language:"en"}).then(()=>{timer=setTimeout(stop,8000)}).catch(err=>{
        if(err?.code==="not_granted") toast("Microphone is off. You can still say it out loud.");
        fin();
      });
      return;
    }
    if(SR){
      const r=new SR(); r.lang="en-US"; r.interimResults=true; r.maxAlternatives=1; r.continuous=false;
      let best="";
      r.onresult=e=>{ best=Array.from(e.results).map(x=>x[0].transcript).join(" "); onPartial&&onPartial(best); };
      r.onerror=e=>{ if(e.error==="not-allowed") toast("Please allow the microphone for this app."); };
      r.onend=()=>{ micStop=null; resolve(best.trim()); };
      micStop=()=>{ try{r.stop()}catch(e){} };
      try{ r.start(); }catch(e){ resolve(""); }
      return;
    }
    resolve(null);
  });
}

/* ============ COMPARE ============ */
const CONTR={"i'm":"i am","you're":"you are","we're":"we are","that's":"that is","what's":"what is","it's":"it is","here's":"here is","let's":"let us","can't":"can not","cannot":"can not","don't":"do not","didn't":"did not","i'll":"i will","we'll":"we will","won't":"will not","y'all":"you all","ya'll":"you all","ok":"okay","mayo":"mayo","dr":"doctor","bbq":"barbecue"};
const NUM={"1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","12":"twelve","49":"forty nine","75":"seventy five"};
function norm(s){
  return s.toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z0-9' ]+/g," ").split(/\s+/).filter(Boolean)
    .flatMap(w=>{ w=CONTR[w]||NUM[w]||w; return w.split(" "); }).map(w=>w.replace(/'/g,"")).filter(Boolean);
}
function compare(target,heard){
  const t=norm(target), h=norm(heard);
  const dp=Array.from({length:t.length+1},()=>new Array(h.length+1).fill(0));
  for(let i=t.length-1;i>=0;i--)for(let j=h.length-1;j>=0;j--)
    dp[i][j]= t[i]===h[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  const ok=new Set(); let i=0,j=0;
  while(i<t.length&&j<h.length){ if(t[i]===h[j]){ok.add(i);i++;j++} else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++; }
  // map back to display words
  const disp=target.split(/\s+/); let k=0;
  const html=disp.map(w=>{ const n=norm(w).length||0; let good=true; for(let x=0;x<n;x++){ if(!ok.has(k+x)) good=false; } k+=n;
    return `<span class="${good?'w-ok':'w-miss'}">${esc(w)}</span>`; }).join(" ");
  const score=t.length? Math.round(ok.size/t.length*100):0;
  return {score,html};
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ============ SESSIONS ============ */
function speakSession(list,title){ startSession(list.map(p=>({type:"speak",item:p})),title,title.startsWith("Learn")?"learn":"speak"); }
function listenSession(list,title){ startSession(list.map(c=>({type:"listen",item:c})),title,"ears"); }
function dialogSession(){
  const d=DIALOGS[S.dialog%DIALOGS.length]; S.dialog++; save();
  startSession(d.turns.map(t=>({type:"dialog",item:t,title:d.title})),"Drive-thru: "+d.title,"drive");
}
function startSession(queue,title,stepId){ sess={queue,i:0,title,stepId,good:0}; view="session"; render(); }
function finishSession(){
  const d=today(); if(sess.stepId && !d.done.includes(sess.stepId)) d.done.push(sess.stepId); save();
  const g=sess.good, n=sess.queue.length;
  $v.innerHTML=`<div class="card" style="text-align:center;padding:28px 16px"><div style="font-size:56px">🎉</div><h1>Great job!</h1>
    <p class="sub">${g} of ${n} were good.</p></div>
    <button class="big primary" id="home">Back to today</button>`;
  document.getElementById("home").onclick=()=>setTab("today");
  sess=null; view="done";
}
function nextItem(ok){
  const it=sess.queue[sess.i];
  if(ok!==undefined && it.type!=="dialog"){ grade(it.item.id,ok); if(ok) sess.good++; }
  else if(ok) sess.good++;
  if(ok===false && it.type!=="dialog" && !it.again){ sess.queue.push({...it,again:true}); } // try once more at the end
  sess.i++; if(sess.i>=sess.queue.length) finishSession(); else render();
}
function topBar(){ return `<div class="top"><button class="back" id="back" aria-label="Back">←</button><h2>${esc(sess.title)}</h2><span class="count">${sess.i+1} / ${sess.queue.length}</span></div>
  <div class="bar"><i style="width:${sess.i/sess.queue.length*100}%"></i></div>`; }
function renderSession(){
  const it=sess.queue[sess.i];
  if(it.type==="speak") renderSpeak(it.item);
  else if(it.type==="listen") renderListen(it.item);
  else renderDialog(it);
  document.getElementById("back").onclick=()=>setTab("today");
}
function micBlock(target,onResult){
  return { html: micAvailable()
    ? `<button class="big mic" id="mic">🎤 Tap and say it</button><div id="res"></div>`
    : `<div class="tip">Say it out loud 3 times. Then choose.</div><div class="row"><button class="big ghost" id="selfno">😕 Hard</button><button class="big primary" id="selfok">👍 I said it</button></div>`,
  wire(){
    const mic=document.getElementById("mic");
    if(!mic){ document.getElementById("selfno").onclick=()=>onResult(null,false); document.getElementById("selfok").onclick=()=>onResult(null,true); return; }
    const res=document.getElementById("res");
    mic.onclick=()=>{
      if(micStop){ micStop(); return; }
      mic.classList.add("on"); mic.textContent="⏹ Listening… tap when done";
      res.innerHTML=`<p class="heard">…</p>`;
      listen(t=>{ res.innerHTML=`<p class="heard">“${esc(t)}”</p>`; }).then(heard=>{
        mic.classList.remove("on"); mic.textContent="🎤 Try again";
        if(heard===null) return;
        if(!heard){ res.innerHTML=`<div class="tip">I didn't hear anything. Speak a little louder and closer to the phone.</div>`; return; }
        const c=compare(target,heard);
        const msg=c.score>=90?"Excellent! 🌟":c.score>=70?"Good! Almost there.":c.score>=40?"Keep going. Listen slow, then try again.":"Listen 🐢 slow first, then try again.";
        res.innerHTML=`<div class="card" style="gap:8px"><div class="score">${c.score}% · ${msg}</div><div class="words">${c.html}</div><p class="heard">I heard: “${esc(heard)}”</p>
          ${c.score<90?`<p class="note">Orange words were missed. Say those slowly.</p>`:""}</div>`;
        onResult(c.score,c.score>=70);
      });
    };
  }};
}

/* ============ TEXAS TALK ============ */
function renderAccent(){
  $v.innerHTML=`<h1>Texas talk</h1>
    <p class="sub">How customers in Texas really speak. White and Black Texans share most of these. The phone voice can't do a real Texas accent, so read "sounds like" and listen to real people too.</p>
    <button class="big primary" id="ears">👂 Practice hearing customers</button>
    <div class="card">${ACCENT.map((a,i)=>`<div class="feature"><b>${esc(a.t)}</b><span>${esc(a.d)}</span>${urOn()?urT(ACCENT_UR[i][0]+": "+ACCENT_UR[i][1]):""}
      <button data-ex="${i}">🔊 “${esc(a.ex)}”</button></div>`).join("")}</div>
    <div class="card"><b>Listen to real Texans</b><p class="note">Watch a few minutes of local Texas TV news, Texas YouTube food reviews, or drive-thru videos. Say what you hear out loud.</p>
      <a href="https://www.youtube.com/results?search_query=texas+drive+thru+order" target="_blank" rel="noopener" style="color:var(--flame);font-weight:700">Open YouTube: Texas drive-thru videos ↗</a></div>`;
  document.getElementById("ears").onclick=()=>listenSession(pick(ALLC,8).length?pick(ALLC,8):shuffle(ALLC).slice(0,8),"Hear customers");
  $v.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>say(ACCENT[b.dataset.ex].ex,{rate:1.05,kind:"cust"}));
}

/* ============ SESSIONS ============ */
function allSessions(){
  const out=[]; const tk=dkey();
  Object.keys(S.days).sort().forEach(k=>{ const d=S.days[k]; let n=0;
    (d.hist||[]).forEach(h=>out.push({day:k,n:++n,sec:h.sec,steps:h.steps,live:false}));
    const cur=d.sec-(d.roundStart||0);
    if(cur>=60||d.done.length) out.push({day:k,n:++n,sec:cur,steps:d.done.length,live:k===tk});
  });
  out.forEach(x=>x.full=x.sec>=DAY_GOAL);
  return out;
}
function sessStats(){ const a=allSessions(); return {all:a, full:a.filter(x=>x.full).length, part:a.filter(x=>!x.full&&!x.live).length, live:a.find(x=>x.live&&!x.full)}; }
function niceDay(k){ const [y,m,dd]=k.split("-").map(Number); const d=new Date(y,m-1,dd); const t=dkey(); const yd=new Date(); yd.setDate(yd.getDate()-1);
  return k===t?"Today":k===dkey(yd)?"Yesterday":d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}); }
function renderSessions(){
  const st=sessStats(); const list=[...st.all].reverse();
  $v.innerHTML=`<div class="top"><button class="back" id="sback" aria-label="Back">←</button><h2>📅 My sessions</h2></div>
    <div class="card"><div class="stats">
      <div><b style="color:var(--good)">${st.full}</b><span>✔ Completed<br>30 min or more</span></div>
      <div><b style="color:var(--bad)">${st.part}</b><span>⏳ Not finished<br>under 30 min</span></div>
      <div><b>${st.all.length}</b><span>All sessions</span></div></div>
      ${st.live?`<p class="note">Today's session is still going: ${fmtMin(st.live.sec)} of 30 min. It counts when she reaches 30 minutes or starts a new round.</p>`:""}</div>
    ${list.length?`<div class="plist">${list.map((x,i)=>`<div class="pitem" style="gap:12px">
      <span style="font-size:26px">${x.full?"✔":x.live?"▶":"⏳"}</span>
      <span class="t"><b>${niceDay(x.day)}</b>${x.n>1||(S.days[x.day].hist||[]).length?` · round ${x.n}`:""}<br>
      <span class="note">${fmtMin(x.sec)} min · ${x.steps} of 5 steps · ${x.full?"Completed":x.live?"In progress":"Not finished"}</span></span>
      <span style="font-variant-numeric:tabular-nums;font-weight:700;color:${x.full?"var(--good)":"var(--soft)"}">#${list.length-i}</span></div>`).join("")}</div>`
      :`<div class="card"><b>No sessions yet</b><p class="note">Go to Today and tap Start. Each practice of 30 minutes or more counts as a completed session.</p></div>`}`;
  document.getElementById("sback").onclick=()=>setTab("today");
}

/* ============ PROGRESS ============ */
function renderProgress(){
  const days=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push({k:dkey(d),l:"SMTWTFS"[d.getDay()],sec:S.days[dkey(d)]?.sec||0}); }
  const all=[...ALLP,...ALLC]; const learned=all.filter(x=>(S.cards[x.id]?.box||0)>=1).length;
  const strong=all.filter(x=>(S.cards[x.id]?.box||0)>=4).length;
  const totalMin=Object.values(S.days).reduce((a,d)=>a+d.sec,0)/60|0;
  $v.innerHTML=`<h1>Progress</h1>
    <div class="card"><div class="stats"><div><b>🔥 ${streak()}</b><span>days in a row</span></div><div><b>${learned}</b><span>of ${all.length} practiced</span></div><div><b>${strong}</b><span>remembered well</span></div></div></div>
    <button class="big ghost" id="psess">📅 My sessions · ✔ ${sessStats().full} done · ⏳ ${sessStats().part} not finished</button>
    <div class="card"><b>Minutes this week</b><div class="week">${days.map(d=>`<div><s class="${d.sec>=DAY_GOAL?"full":""}" style="height:${Math.min(100,d.sec/DAY_GOAL*100)}%"></s>${d.l}</div>`).join("")}</div>
      <p class="note">Green = 30 minutes done. Total: ${totalMin} minutes.</p></div>
    <div class="card"><b>Urdu help اردو</b><div class="seg" style="grid-template-columns:1fr 1fr"><button data-ur="1" aria-pressed="${urOn()}">Show Urdu</button><button data-ur="0" aria-pressed="${!urOn()}">English only</button></div>
      <p class="note">Tip: when she knows a phrase well, turn Urdu off to practice thinking in English.</p></div>
    <div class="card"><b>Voice speed</b><div class="seg">${[[.75,"Slow"],[1,"Normal"],[1.2,"Fast"]].map(([r,l])=>`<button data-rate="${r}" aria-pressed="${S.rate==r}">${l}</button>`).join("")}</div>
      <b>Voice</b><select id="voice"><option value="">Default</option>${voices.map(v=>`<option ${v.name===S.voice?"selected":""}>${esc(v.name)}</option>`).join("")}</select>
      <button class="big ghost" id="test">🔊 Test voice</button></div>
    <div class="card"><b>How this app helps you remember</b>
      <p class="note">Every phrase comes back: the next day, then in 2 days, 4 days, 1 week, 2 weeks and 1 month. If you miss it, it comes back today. Do a little every day. 30 minutes every day is better than 3 hours once a week.</p></div>
    <div class="card"><b>Start over</b><p class="note">Deletes all progress on this phone.</p>
      <div id="resetbox"><button class="big ghost" id="reset">Reset progress</button></div></div>`;
  document.getElementById("psess").onclick=()=>{view="sessions";render();scrollTo(0,0)};
  $v.querySelectorAll("[data-ur]").forEach(b=>b.onclick=()=>{S.ur=b.dataset.ur==="1";save();render()});
  $v.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>{S.rate=+b.dataset.rate;save();render()});
  document.getElementById("voice").onchange=e=>{S.voice=e.target.value;save()};
  document.getElementById("test").onclick=()=>say("Welcome to Burger King, what can I get for you today?");
  document.getElementById("reset").onclick=()=>{ document.getElementById("resetbox").innerHTML=`<div class="row"><button class="big ghost" id="rno">Cancel</button><button class="big primary" id="ryes">Yes, delete</button></div>`;
    document.getElementById("rno").onclick=render; document.getElementById("ryes").onclick=()=>{S={cards:{},days:{},rate:1,voice:"",dialog:0};save();render();toast("Progress deleted.")}; };
}

/* ============ ROUTER ============ */
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current",(b.dataset.tab===view||(view==="session"&&false))?"page":"false"));
  if(view==="today") renderToday();
  else if(view==="phrases") renderPhrases();
  else if(view==="accent") renderAccent();
  else if(view==="progress") renderProgress();
  else if(view==="session") renderSession();
  else if(view==="sessions") renderSessions();
}
render();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})</script></body></html>
